# Example nginx site in front of the HTTP server.
# Put the limit_req_zone line in the http {} block (e.g. /etc/nginx/conf.d/).
#
#   limit_req_zone $binary_remote_addr zone=smard_mcp:10m rate=5r/s;
#
# Behind Cloudflare, $binary_remote_addr is a Cloudflare address unless
# set_real_ip_from/real_ip_header CF-Connecting-IP are configured.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.org;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.example.org;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location = /mcp {
        limit_req zone=smard_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8450;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Responses may be streamed as server-sent events.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location = /health { proxy_pass http://127.0.0.1:8450; }

    location / { return 404; }
}
