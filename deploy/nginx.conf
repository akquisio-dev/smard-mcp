# Example nginx setup in front of the HTTP server.
#
# --- http {} level, e.g. /etc/nginx/conf.d/smard-mcp.conf ---------------
#
#   limit_req_zone $binary_remote_addr zone=smard_mcp:10m rate=5r/s;
#
#   # Shortened client address for the access log: IPv4 without the last
#   # octet, IPv6 at most the first three blocks (/48). The first matching
#   # regex wins; "~:" catches IPv6 addresses compressed within the first
#   # three blocks (e.g. 2001::abcd) so they are never logged in full.
#   map $remote_addr $smard_anon_ip {
#       "~^(?P<v4>\d+\.\d+\.\d+)\.\d+$"                      "$v4.0";
#       "~^(?P<v6>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):"  "$v6::";
#       "~:"                                                 "::";
#       default                                              "-";
#   }
#   # No query string, referrer or user agent.
#   log_format smard_anon '$smard_anon_ip [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
#
# Behind Cloudflare, $remote_addr is a Cloudflare address unless
# set_real_ip_from (all Cloudflare ranges) and real_ip_header
# CF-Connecting-IP are configured in the server block.
#
# Logs are kept 7 days with logrotate (daily, rotate 6, maxage 7) in a
# directory of their own, so the distribution's nginx rotation does not
# also pick them up.

server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.org;
    access_log /var/log/nginx/smard-mcp/access.log smard_anon;
    error_log /var/log/nginx/smard-mcp/error.log error;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.example.org;
    access_log /var/log/nginx/smard-mcp/access.log smard_anon;
    error_log /var/log/nginx/smard-mcp/error.log error;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location = /mcp {
        limit_req zone=smard_mcp burst=20 nodelay;
        limit_req_status 429;
        # Rejections are not logged (the error log would contain the full IP).
        limit_req_log_level info;

        proxy_pass http://127.0.0.1:8450;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Responses may be streamed as server-sent events.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # /health and /health?deep=1 (checks SMARD at most every 5 minutes)
    location = /health { proxy_pass http://127.0.0.1:8450; }

    location / { return 404; }
}
