version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # The server runs on Node 22: newer type definitions would allow APIs it lacks.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # typescript-eslint supports TypeScript <6.1 only.
      - dependency-name: typescript
        versions: [">=6.1"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
